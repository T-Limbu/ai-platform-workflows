name: YouTube Extractor Workflow

on:
  workflow_call:
    inputs:
      video_url:
        required: true
        type: string
        description: "The URL of the YouTube video to process"
      prompt:
        required: false
        type: string
        default: "Extract all key principles, actionable techniques, and concrete rules from this video into a structured breakdown."
        description: "The prompt to use for extraction"
      output_format:
        required: false
        type: string
        default: "json"
        description: "Output format: json or markdown"
      model:
        required: false
        type: string
        default: "gemini-3.8-flash"
        description: "The model to use"
      workflows_ref:
        required: false
        type: string
        default: "main"
        description: "ref of ai-platform-workflows to run; pass the same SHA you pinned in uses:"
    secrets:
      GEMINI_API_KEY:
        required: false
        description: "Google Gemini API Key (inherited or passed from caller)"
    outputs:
      extracted_content:
        description: "The extracted content"
        value: ${{ jobs.extract.outputs.extracted_content }}
      output_file:
        description: "Path to the output file"
        value: ${{ jobs.extract.outputs.output_file }}
  workflow_dispatch:
    inputs:
      video_url:
        required: true
        type: string
        description: "The URL of the YouTube video to process"
      prompt:
        required: false
        type: string
        default: "Extract all key principles, actionable techniques, and concrete rules from this video into a structured breakdown."
      output_format:
        required: false
        type: string
        default: "json"
      model:
        required: false
        type: string
        default: "gemini-3.8-flash"

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      extracted_content: ${{ steps.run-extractor.outputs.extracted_content }}
      output_file: ${{ steps.run-extractor.outputs.output_file }}
    steps:
      - name: Checkout ai-platform-workflows
        uses: actions/checkout@v4
        with:
          repository: T-Limbu/ai-platform-workflows
          ref: ${{ github.repository == 'T-Limbu/ai-platform-workflows' && github.sha || inputs.workflows_ref }}
          path: .squad-workflows

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r .squad-workflows/connectors/youtube/requirements.txt

      - name: Run Extraction Script
        id: run-extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
          PROMPT: ${{ inputs.prompt }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          MODEL: ${{ inputs.model }}
        run: |
          python .squad-workflows/connectors/youtube/extractor.py --url "$VIDEO_URL" --prompt "$PROMPT" --format "$OUTPUT_FORMAT" --model "$MODEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-extraction
          path: output.*
