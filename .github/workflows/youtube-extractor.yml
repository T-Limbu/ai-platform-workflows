name: YouTube Extractor Workflow

on:
  workflow_call:
    inputs:
      video_url:
        required: true
        type: string
        description: "The URL of the YouTube video to process"
      prompt:
        required: false
        type: string
        default: "Extract all key principles, actionable techniques, and concrete rules from this video into a structured breakdown."
        description: "The prompt to use for extraction"
      output_format:
        required: false
        type: string
        default: "json"
        description: "Output format: json or markdown"
      model:
        required: false
        type: string
        default: "gemini-3.8-flash"
        description: "The model to use"
    outputs:
      extracted_content:
        description: "The extracted content"
        value: ${{ jobs.extract.outputs.extracted_content }}
      output_file:
        description: "Path to the output file"
        value: ${{ jobs.extract.outputs.output_file }}
  workflow_dispatch:
    inputs:
      video_url:
        required: true
        type: string
        description: "The URL of the YouTube video to process"
      prompt:
        required: false
        type: string
        default: "Extract all key principles, actionable techniques, and concrete rules from this video into a structured breakdown."
      output_format:
        required: false
        type: string
        default: "json"
      model:
        required: false
        type: string
        default: "gemini-3.8-flash"

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      extracted_content: ${{ steps.run-extractor.outputs.extracted_content }}
      output_file: ${{ steps.run-extractor.outputs.output_file }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install google-genai
      - name: Run Extraction Script
        id: run-extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python connectors/youtube/extractor.py --url "${{ inputs.video_url }}" --prompt "${{ inputs.prompt }}" --format "${{ inputs.output_format }}" --model "${{ inputs.model }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-extraction
          path: output.*
